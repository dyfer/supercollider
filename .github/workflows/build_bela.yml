name: Build Bela
on:
  push:
  workflow_dispatch:

jobs:
  build-bela:
    runs-on: ubuntu-${{ matrix.os-version }}
    strategy:
      fail-fast: false
      matrix:
        include:

          - job-name: "Bela"
            os-version: "26.04-arm"
            compiler-packages: "gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf"
            arch: "armhf"
            debian-arch: "armhf"
            library-arch: "arm-linux-gnueabihf"
            artifact-suffix: "bela"
            bela-image-url: "https://github.com/BelaPlatform/bela-image-builder/releases/download/v0.3.8h/bela_image_v0.3.8h.img.xz"

          - job-name: "Bela Gem"
            os-version: "26.04-arm"
            compiler-packages: ""
            arch: "aarch64"
            debian-arch: "arm64"
            library-arch: "aarch64-linux-gnu"
            artifact-suffix: "bela-gem"
            bela-image-url: "https://github.com/BelaPlatform/gem-image-builder/releases/download/v1.0.2/pocketbeagle2-debian-12.13-bela-v6.12-arm64-2026-03-25-8gb.img.xz"


    name: Ubuntu ${{ matrix.os-version }} ${{ matrix.job-name }}
    env:
      BUILD_PATH: ${{ github.workspace }}/build
      INSTALL_PATH: ${{ github.workspace }}/build/Install
      SYSROOT: ${{ github.workspace }}/../sysroot
      TOOLCHAIN_FILE: ${{ github.workspace }}/build/Toolchain-${{ matrix.library-arch }}.cmake

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: set version string for artifacts
        id: set-version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            FULL_TAG=${GITHUB_REF#refs/tags/}
            SC_VERSION=${FULL_TAG##Version-}
          else
            SC_VERSION=$GITHUB_SHA
          fi
          echo "version=$SC_VERSION" >> $GITHUB_OUTPUT

      - name: prepare daily timestamp for cache
        id: current-date
        run: echo "stamp=$(date '+%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: cache ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ccache
            ~/.cache/ccache
          key: ${{ runner.os }}-bela-${{ matrix.os-version }}-${{ steps.current-date.outputs.stamp }}
          restore-keys: ${{ runner.os }}-bela-${{ matrix.os-version }}-

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config xz-utils ninja-build wget ccache ${{ matrix.compiler-packages }}

      - name: Download and mount Bela image
        run: |
          wget -q ${{ matrix.bela-image-url }} -O bela_image.img.xz
          xz -d bela_image.img.xz
          
          # Attach the uncompressed image to a loop device and parse partitions
          sudo losetup -P -f bela_image.img
          LOOP_DEV=$(sudo losetup -a | grep "bela_image.img" | cut -d: -f1)
          
          mkdir -p ${SYSROOT}
          # Mount partition 1, which contains the root filesystem on Bela/BeagleBone images
          sudo mount ${LOOP_DEV}p1 ${SYSROOT}

      - name: Create required symlinks
        run: |
          sudo ln -s ${SYSROOT}/usr/xenomai /usr/xenomai
          sudo ln -s ${SYSROOT}/lib/${{ matrix.library-arch }} /lib/${{ matrix.library-arch }}

      - name: Generate Toolchain.cmake
        run: |
          cat << 'EOF' > ${TOOLCHAIN_FILE}
          SET(CMAKE_SYSTEM_NAME Linux)
          SET(CMAKE_SYSTEM_VERSION 1)
          
          set(CMAKE_SYSTEM_PROCESSOR arm )
          SET(CMAKE_LIBRARY_ARCHITECTURE ${{ matrix.library-arch }})
          
          set(FLAGS "${FLAGS} -Wl,-rpath-link,${SYSROOT}/lib/${{ matrix.library-arch }}")
          set(FLAGS "${FLAGS} -Wl,-rpath-link,${SYSROOT}/usr/lib/${{ matrix.library-arch }}")
          set(FLAGS "${FLAGS} -Wl,-rpath-link,${SYSROOT}/usr/local/lib")
          set(RPATH_FLAGS ${FLAGS})
          
          if("${{ matrix.arch }}" STREQUAL "armhf")
            set(GCC_BASE "/usr/bin/${{ matrix.library-arch }}-")
          elseif("${{ matrix.arch }}" STREQUAL "aarch64")
            set(GCC_BASE "/usr/bin/")
          endif()
          
          SET(CMAKE_C_COMPILER ${GCC_BASE}gcc)
          SET(CMAKE_CXX_COMPILER ${GCC_BASE}g++)
          SET(CMAKE_ASM_COMPILER ${GCC_BASE}as)
          SET(CMAKE_RANLIB ${GCC_BASE}ranlib)
          UNSET(CMAKE_C_FLAGS CACHE)
          UNSET(CMAKE_CXX_FLAGS CACHE)
          
          set(COMMON_FLAGS "-no-pie -fno-pie")
          set(CMAKE_EXE_LINKER_FLAGS "-no-pie")
          set(CMAKE_SHARED_LINKER_FLAGS "-no-pie")
          set(CMAKE_CXX_FLAGS "${CMAKE_CXX_FLAGS}${COMMON_FLAGS} ${RPATH_FLAGS}" CACHE STRING "c++ flags" FORCE)
          set(CMAKE_C_FLAGS "${CMAKE_C_FLAGS}${COMMON_FLAGS} ${RPATH_FLAGS}" CACHE STRING "c flags" FORCE)
          
          set(CMAKE_C_LINK_FLAGS "${CMAKE_C_LINK_FLAGS}" CACHE INTERNAL "c link flags" FORCE)
          set(CMAKE_CXX_LINK_FLAGS "${CMAKE_CXX_LINK_FLAGS}" CACHE INTERNAL "c++ link flags" FORCE)
          
          SET(CMAKE_SYSROOT ${SYSROOT})
          SET(CMAKE_FIND_ROOT_PATH ${SYSROOT})
          
          SET(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          SET(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          SET(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          EOF

      - name: configure
        run: |
          mkdir $BUILD_PATH && cd $BUILD_PATH

          # Confine pkg-config strictly to the sysroot
          export PKG_CONFIG_DIR=""
          export PKG_CONFIG_SYSROOT_DIR="${SYSROOT}"
          export PKG_CONFIG_LIBDIR="${PKG_CONFIG_SYSROOT_DIR}/usr/lib/pkgconfig:${PKG_CONFIG_SYSROOT_DIR}/usr/share/pkgconfig:${PKG_CONFIG_SYSROOT_DIR}/usr/lib/${{ matrix.library-arch }}/pkgconfig"

          cmake -DSC_EL=OFF -DSC_VIM=OFF -DSC_QT=OFF -DSC_IDE=OFF \
          -DINSTALL_HELP=OFF -DNO_X11=ON -DSC_HIDAPI=OFF -DNO_AVAHI=ON \
          -DSUPERNOVA=OFF -DENABLE_TESTSUITE=OFF \
          -DCMAKE_INSTALL_PREFIX:PATH=$INSTALL_PATH -DCMAKE_BUILD_TYPE=Release \
          -DAUDIOAPI=bela -DBELA_CONFIG_PATH="${SYSROOT}/usr/local/bin/bela-config" \
          -DCMAKE_TOOLCHAIN_FILE="${TOOLCHAIN_FILE}" .. # --debug-output

      - name: build
        run: |
          cd $BUILD_PATH
          make -j$(nproc)

      - name: Create Debian Package
        env:
          ARTIFACT_FILE: "SuperCollider-${{ steps.set-version.outputs.version }}-${{ matrix.artifact-suffix }}"
        run: |
          cd ${{ env.BUILD_PATH }}
          cpack -G DEB \
            -D CPACK_PACKAGE_CONTACT="SuperCollider Team" \
            -D CPACK_DEBIAN_PACKAGE_ARCHITECTURE="${{ matrix.debian-arch }}" \
            -D CPACK_CMAKE_GENERATOR=Ninja \
            -D CPACK_PACKAGE_FILE_NAME="${{ env.ARTIFACT_FILE }}" \
            -D CPACK_STRIP_FILES=true

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        if: matrix.artifact-suffix
        env:
          ARTIFACT_FILE: "SuperCollider-${{ steps.set-version.outputs.version }}-${{ matrix.artifact-suffix }}"
        with:
          name: ${{ env.ARTIFACT_FILE }}
          path: ${{ env.INSTALL_PATH }}/${{ env.ARTIFACT_FILE }}.deb

